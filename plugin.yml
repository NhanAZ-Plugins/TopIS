name: TopIS
version: 3.0.0
api: 5.0.0
authors: ["NhanAZ", "kuraLLsz"]
main: kuraLLsz\Main
softdepend: [PureChat]

commands:
  is:
    description: View your island progress
    permission: topis.command.is
  topis:
    description: View the island leaderboard
    permission: topis.command.topis
permissions:
  topis.command.is:
    default: true
  topis.command.topis:
    default: true
